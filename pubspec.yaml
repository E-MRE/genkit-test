name: genkit_refund_experiment
description: Minimal Genkit Dart experiment implementing a Turkish refund assistant flow with tool calling, structured output, HTTP serving, and an evaluation harness.
version: 0.1.0
publish_to: none

environment:
  sdk: ^3.10.0

dependencies:
  genkit: 0.16.1
  genkit_google_genai: 0.3.1
  genkit_shelf: 0.1.13
  schemantic: 0.2.2
  shelf: ^1.4.2
  shelf_router: ^1.1.4

dev_dependencies:
  build_runner: ^2.4.15
  lints: ^6.0.0
  schemantic_builder: 0.1.2
  test: ^1.25.15
