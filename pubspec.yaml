name: genkit_refund_experiment
description: Minimal Genkit Dart experiment implementing a Turkish refund assistant flow with tool calling, structured output, HTTP serving, and an evaluation harness.
version: 0.1.0
publish_to: none

environment:
  sdk: ^3.12.0

dependencies:
  genkit: ^1.0.3
  genkit_google_genai: ^1.2.0
  genkit_shelf: ^1.0.3
  schemantic: ^1.0.0
  shelf: ^1.4.2
  shelf_router: ^1.1.4

dev_dependencies:
  build_runner: ^2.4.15
  lints: ^6.0.0
  schemantic_builder: ^1.0.0
  test: ^1.25.15
